name: Editor baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'packages/**'
      - 'apps/docs/**'
      - 'apps/markdown/**'
      - 'apps/hwp/**'
      - 'baseline/**'
      - 'tools/editor/**'
      - 'package*.json'
      - '.github/workflows/editor-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx eslint web tools/editor packages/editor packages/core
      - run: npm run check:baseline
      - run: npm run test:baseline
      - run: npm run check:hangul-parity
      - run: npm run typecheck:editor
      - run: npm run test:editor
      - run: npm run build:editor
      - run: npm run build:web
